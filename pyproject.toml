[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-flow-lab"
version = "0.1.0"
description = "Reproducible particle image velocimetry and machine-learning analysis of droplet flow patterns"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "pillow>=10,<13"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
droplet-lab = "droplet_lab.cli:main"

[tool.setuptools.packages.find]
include = ["droplet_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
